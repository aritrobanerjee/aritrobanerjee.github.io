name: Build Resume

on:
  push:
    paths:
      - 'resume/**'
      - '.github/workflows/build-resume.yml'
  pull_request:
    paths:
      - 'resume/**'
  workflow_dispatch:

jobs:
  build:
    name: Compile Word & PDF Exports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium for Headless PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Build Resume
        run: |
          node resume/export.js
          node resume/export.js --input=resume/resume.example.md --out=resume/dist/sample

      - name: Upload Resume Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-builds
          path: |
            resume/*.docx
            resume/*.pdf
            resume/dist/sample/*.docx
            resume/dist/sample/*.pdf
          if-no-files-found: error

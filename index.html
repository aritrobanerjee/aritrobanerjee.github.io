    <!-- GitHub Pages SPA Redirect Decoder (restores clean URL if 404 redirected) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).reduce(function(acc, curr) {
            var parts = curr.split('=');
            acc[parts[0]] = parts[1];
            return acc;
          }, {});
          if (decoded.p) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (decoded.p.startsWith('/') ? decoded.p : '/' + decoded.p) +
              (decoded.q ? '?' + decoded.q : '') +
              l.hash
            );
          }
        }
      }(window.location))

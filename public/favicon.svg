  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#27272a" stroke-width="1" shape-rendering="geometricPrecision"/>

  <!-- Pixel Letter A -->
  <rect x="6" y="8" width="6" height="2" fill="#ededed" />

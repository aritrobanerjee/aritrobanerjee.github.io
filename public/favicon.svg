  <rect x="12" y="10" width="2" height="14" fill="#ededed" />
  <rect x="6" y="14" width="6" height="2" fill="#ededed" />

  <!-- Pixel Letter B -->
  <rect x="18" y="8" width="2" height="16" fill="#ededed" />
  <rect x="20" y="8" width="6" height="2" fill="#ededed" />
  <rect x="26" y="10" width="2" height="4" fill="#ededed" />
  <rect x="20" y="14" width="6" height="2" fill="#ededed" />
